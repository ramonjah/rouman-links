name: Refresh Spotify top tracks
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: spotify-top
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync-spotify.py
      - name: Save verified snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spotify-top.json
          git diff --cached --quiet || git commit -m 'Refresh verified Spotify top tracks'
          git push
      - name: Prepare public site
        run: |
          mkdir _site
          cp index.html CNAME spotify-top.json rouman-logo*.png _site/
          cp -R covers _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
