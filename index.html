<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10110f">
  <title>ROUMAN — Music & Links</title>
  <meta name="description" content="Rouman. Drum & bass producer. Music, remixes, DJ sets and social links.">
  <meta property="og:title" content="ROUMAN — Music & Links">
  <meta property="og:description" content="Drum & bass. Releases, remixes, sets & more.">
  <style>
    :root{color-scheme:dark;--bg:#10110f;--fg:#f0f0e6;--muted:#999b93;--line:#30322c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}a:focus-visible{outline:2px solid var(--fg);outline-offset:5px}
    body{isolation:isolate;min-height:100svh}.cover-wall{position:fixed;inset:-12%;z-index:-2;display:grid;grid-template-columns:repeat(3,1fr);transform:rotate(-12deg) scale(1.1);pointer-events:none}.cover-wall img{width:100%;height:100%;min-height:0;object-fit:cover;filter:saturate(.65);opacity:.65}body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(10,11,10,.45),rgba(10,11,10,.89) 32%,rgba(10,11,10,.89) 68%,rgba(10,11,10,.45));pointer-events:none}.link{background:rgba(16,17,15,.88);backdrop-filter:blur(12px)}.profile{text-shadow:0 2px 20px #000}.subtitle,.contact{color:#c1c3bb}
    main{max-width:440px;margin:0 auto;padding:56px 24px 40px}.profile{text-align:center;margin-bottom:35px}.portrait{display:block;width:160px;height:160px;object-fit:cover;border-radius:50%;margin:0 auto 25px}h1{font-size:48px;line-height:1;margin:0 0 12px;font-weight:800;letter-spacing:-2.5px}.subtitle{font-size:14px;color:var(--muted);margin:0}.links{display:flex;flex-direction:column;gap:10px}.link{display:flex;align-items:center;justify-content:space-between;min-height:58px;padding:16px 20px;border:1px solid var(--line);border-radius:6px;font-size:16px;transition:background .15s,border-color .15s}.link:hover{background:#1c1e19;border-color:#73776a}.arrow{color:var(--muted)}.contact{display:block;text-align:center;margin-top:29px;font-size:12px;color:var(--muted)}.contact:hover{color:var(--fg)}
    @media(max-width:500px){.cover-wall{inset:-5% -60%;grid-template-columns:repeat(3,1fr)}body::before{background:rgba(10,11,10,.78)}main{padding-top:38px}.portrait{width:140px;height:140px}h1{font-size:43px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}

    .platform-icon{width:25px;height:25px;flex-shrink:0;color:var(--muted);transition:transform .25s,color .25s}.link{position:relative;overflow:hidden;transition:transform .2s,background .2s,border-color .2s,box-shadow .2s}.link::before{content:"";position:absolute;inset:0;background:radial-gradient(180px circle at var(--x,50%) var(--y,50%),rgba(210,252,99,.13),transparent);opacity:0;transition:opacity .2s;pointer-events:none}.link:hover,.link:focus-visible{transform:translateY(-3px);border-color:#a2b27d;box-shadow:0 8px 24px #0005}.link:hover::before,.link:focus-visible::before{opacity:1}.link:hover .platform-icon,.link:focus-visible .platform-icon{color:#d2fc63;transform:rotate(-7deg) scale(1.13)}.link:active{transform:translateY(0) scale(.98)}.portrait{transition:transform .35s,box-shadow .35s}.portrait:hover{transform:scale(1.04);box-shadow:0 0 0 4px #d2fc6325}.cover-wall{transition:transform .6s ease-out;transform:translate(var(--px,0px),var(--py,0px)) rotate(-12deg) scale(1.1)}
    @media(hover:none){.link:hover{transform:none}.link:active{transform:scale(.98)}}
    @media(prefers-reduced-motion:reduce){.link:hover,.link:active,.link:focus-visible,.portrait:hover,.link:hover .platform-icon,.link:focus-visible .platform-icon{transform:none}.cover-wall{transform:rotate(-12deg) scale(1.1)}}
    .cover-wall{animation:cover-drift 24s ease-in-out infinite;will-change:transform}
    @keyframes cover-drift{
      0%,100%{transform:translate(calc(var(--px,0px) - 1.5%),calc(var(--py,0px) - 1%)) rotate(-14deg) scale(1.16)}
      50%{transform:translate(calc(var(--px,0px) + 1.5%),calc(var(--py,0px) + 1%)) rotate(-10deg) scale(1.23)}
    }
    @media(prefers-reduced-motion:reduce){.cover-wall{animation:none;will-change:auto}}
    .portrait{width:176px;height:176px;border-radius:22px;object-position:50% 40%;margin-bottom:20px;box-shadow:0 12px 36px #0006}
    h1.artist-name{margin:0 auto 14px;line-height:0;max-width:220px}
    .artist-logo{display:block;width:100%;height:auto;filter:drop-shadow(0 3px 12px #0008)}
    .profile{margin-bottom:28px}
    @media(max-width:500px){main{padding-top:30px}.portrait{width:152px;height:152px;border-radius:18px;margin-bottom:18px}h1.artist-name{max-width:190px;margin-bottom:12px}}
    .portrait-frame{position:relative;width:100%;max-width:360px;aspect-ratio:1;margin:0 auto 18px;border-radius:20px;overflow:hidden;box-shadow:0 16px 48px #0007}
    .portrait-frame .portrait{width:100%;height:100%;margin:0;border-radius:0;object-fit:cover;object-position:center;box-shadow:none}
    .portrait-frame .portrait:hover{transform:none;box-shadow:none}
    .portrait-frame h1.artist-name{position:absolute;z-index:1;left:50%;bottom:4%;transform:translateX(-50%);width:46%;max-width:none;margin:0;pointer-events:none}
    .portrait-frame .artist-logo{filter:drop-shadow(0 2px 5px #0009)}
    @media(max-width:500px){.portrait-frame{max-width:340px;border-radius:16px}.portrait-frame .portrait{width:100%;height:100%;margin:0;border-radius:0}.portrait-frame h1.artist-name{max-width:none;margin:0}}
    h1.artist-name{position:static;transform:none;width:220px;max-width:100%;margin:0 auto 20px;line-height:0}
    @media(max-width:500px){h1.artist-name{width:190px;margin-bottom:18px}}
  </style>
</head>
<body>
  <div class="cover-wall" aria-hidden="true">
    <img src="covers/cinderblock.jpg" alt="">
    <img src="covers/van-damme.jpg" alt="">
    <img src="covers/monkey-head.jpg" alt="">
    <img src="covers/smoke.jpg" alt="">
    <img src="covers/filthy-dog.jpg" alt="">
    <img src="covers/tonight.jpg" alt="">
  </div>
  <main>
    <header class="profile">
      <h1 class="artist-name"><img class="artist-logo" src="rouman-logo.png" alt="ROUMAN" width="1210" height="751"></h1>
      <p class="subtitle">DnB Producer</p>
    </header>
    <nav class="links" aria-label="Music and social links">
      <a class="link" href="https://open.spotify.com/artist/1l3F9u1ySUlZbp3cbl4ZmZ" target="_blank" rel="noopener noreferrer"><span>Spotify</span><svg class="platform-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M6.5 9c4-1.4 7.4-1 11 1M7.5 12c3.2-1 6.3-.7 9 1M8.5 15c2.3-.6 4.6-.4 7 .8"/></svg></a>
      <a class="link" href="https://soundcloud.com/roumanmusic" target="_blank" rel="noopener noreferrer"><span>SoundCloud</span><svg class="platform-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13v4m3-7v7m3-10v10m3-11v11h6a4 4 0 0 0 0-8 6 6 0 0 0-6-3"/></svg></a>
      <a class="link" href="https://music.apple.com/us/artist/rouman/1574340405" target="_blank" rel="noopener noreferrer"><span>Apple Music</span><svg class="platform-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17V5l10-2v12M10 9l10-2"/><ellipse cx="7" cy="18" rx="3" ry="2.5"/><ellipse cx="17" cy="16" rx="3" ry="2.5"/></svg></a>
      <a class="link" href="https://www.beatport.com/artist/rouman/1008372" target="_blank" rel="noopener noreferrer"><span>Beatport</span><svg class="platform-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16V8h4l4 8 4-8h4v8M4 12h4m8 0h4"/></svg></a>
      <a class="link" href="https://t.me/roumanmusic" target="_blank" rel="noopener noreferrer"><span>Telegram</span><svg class="platform-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 18-7-4 16-6-5-4 3 1-6 9-5-6 8"/></svg></a>
      <a class="link" href="https://www.instagram.com/roumandnb/" target="_blank" rel="noopener noreferrer"><span>Instagram</span><svg class="platform-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor" stroke="none"/></svg></a>
    </nav>
    <a class="contact" href="mailto:ruslanromanoff@gmail.com">ruslanromanoff@gmail.com</a>
  </main>
<script>
  const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const fine = window.matchMedia('(hover: hover) and (pointer: fine)');
  document.querySelectorAll('.link').forEach(link => {
    link.addEventListener('pointermove', event => {
      if (motion.matches || !fine.matches) return;
      const rect = link.getBoundingClientRect();
      link.style.setProperty('--x', `${event.clientX - rect.left}px`);
      link.style.setProperty('--y', `${event.clientY - rect.top}px`);
    });
  });
  const wall = document.querySelector('.cover-wall');
  let frame = 0;
  window.addEventListener('pointermove', event => {
    if (motion.matches || !fine.matches) return;
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(() => {
      wall.style.setProperty('--px', `${(event.clientX / innerWidth - .5) * 12}px`);
      wall.style.setProperty('--py', `${(event.clientY / innerHeight - .5) * 12}px`);
    });
  }, {passive: true});
</script>
</body>
</html>
