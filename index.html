  const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const fine = window.matchMedia('(hover: hover) and (pointer: fine)');
  document.querySelectorAll('.link').forEach(link => {
    link.addEventListener('pointermove', event => {
      if (motion.matches || !fine.matches) return;
      const rect = link.getBoundingClientRect();
      link.style.setProperty('--x', `${event.clientX - rect.left}px`);
      link.style.setProperty('--y', `${event.clientY - rect.top}px`);
    });
  });
  const wall = document.querySelector('.cover-wall');
  let frame = 0;
  window.addEventListener('pointermove', event => {
    if (motion.matches || !fine.matches) return;
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(() => {
      wall.style.setProperty('--px', `${(event.clientX / innerWidth - .5) * 12}px`);
      wall.style.setProperty('--py', `${(event.clientY / innerHeight - .5) * 12}px`);
    });
  }, {passive: true});

  const previewTracks = [{"title": "Smoke", "artist": "Teddy Killerz & Rouman", "url": "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/78/fa/d8/78fad838-8c06-d04e-0ae4-ab0ee4bb5c31/mzaf_1176586703979036190.plus.aac.p.m4a", "source": "https://music.apple.com/us/album/smoke/1760799049?i=1760799066&uo=4"}, {"title": "Cinderblock", "artist": "AC13 & Rouman", "url": "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/72/59/7c/72597cdf-3fc0-846a-35a7-391e06c5d3a2/mzaf_15968323859252808680.plus.aac.p.m4a", "source": "https://music.apple.com/us/album/cinderblock/1870585090?i=1870585093&uo=4"}, {"title": "Van Damme", "artist": "Rouman", "url": "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/01/c5/69/01c5698b-d409-5c22-c0c6-9cd12a5b32ac/mzaf_11763942099449255674.plus.aac.p.m4a", "source": "https://music.apple.com/us/album/van-damme/1849212606?i=1849212607&uo=4"}, {"title": "Filthy Dog (Rouman Remix)", "artist": "Rouman, Dominator & Logan D", "url": "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/27/47/8c/27478c26-3ef7-fb0f-6bd4-21f339d2bf86/mzaf_9260899627385795393.plus.aac.p.m4a", "source": "https://music.apple.com/us/album/filthy-dog-rouman-remix/1819774483?i=1819774488&uo=4"}];
  const audio = document.querySelector('#preview-audio');
  const player = document.querySelector('.preview-player');
  const status = document.querySelector('.preview-status');
  const source = document.querySelector('.preview-source');
  const playButtons = [...document.querySelectorAll('.preview-play')];
  let currentTrack = -1;
  let activeButton = null;
  let playRequest = 0;
  function updatePlayButtons() {
    document.querySelector('.artist-name').classList.toggle('is-playing', !audio.paused && !audio.ended && !audio.error);
    playButtons.forEach(button => {
      const playing = button === activeButton && !audio.paused;
      button.setAttribute('aria-pressed', String(playing));
      button.querySelector('path').setAttribute('d', playing ? 'M7 5h4v14H7zm6 0h4v14h-4z' : 'M8 5v14l11-7z');
    });
  }
  function playRandom(button) {
    const request = ++playRequest;
    audio.pause();
    prepareAudioReaction();
    const choices = previewTracks.map((_,i)=>i).filter(i=>i !== currentTrack);
    currentTrack = choices[Math.floor(Math.random()*choices.length)];
    const track = previewTracks[currentTrack];
    activeButton = button;
    player.hidden = false;
    status.textContent = `${track.artist} — ${track.title}`;
    source.href = track.source;
    audio.src = track.url;
    audio.play().catch(() => {
      if (request !== playRequest) return;
      status.textContent = `${track.title} — tap Play in the player to listen. If unavailable, try Next track.`;
      updatePlayButtons();
    });
  }
  playButtons.forEach(button => button.addEventListener('click', () => {
    if (button === activeButton && !audio.paused) { audio.pause(); return; }
    playRandom(button);
  }));
  document.querySelector('.preview-next').addEventListener('click', () => playRandom(activeButton || playButtons[0]));
  ['play','pause','ended','emptied'].forEach(event=>audio.addEventListener(event,updatePlayButtons));
  audio.addEventListener('error',()=>{
    status.textContent = 'Preview unavailable. Try Next track or open the release on Apple Music.';
    updatePlayButtons();
  });

  const reactiveLogo = document.querySelector('.artist-name');
  let audioContext, analyser, frequencyData, reactionFrame = 0, bassLevel = 0;
  function prepareAudioReaction() {
    const Context = window.AudioContext || window.webkitAudioContext;
    if (!Context) return;
    if (!audioContext) {
      audioContext = new Context();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = .65;
      const mediaSource = audioContext.createMediaElementSource(audio);
      mediaSource.connect(analyser);
      analyser.connect(audioContext.destination);
      frequencyData = new Uint8Array(analyser.frequencyBinCount);
    }
    if (audioContext.state === 'suspended') audioContext.resume().catch(()=>{});
  }
  function resetReaction() {
    cancelAnimationFrame(reactionFrame);
    reactionFrame = 0;
    bassLevel = 0;
    reactiveLogo.style.removeProperty('--audio-scale');
    reactiveLogo.style.removeProperty('--audio-glow');
  }
  function reactToAudio() {
    if (audio.paused || audio.ended || audio.error) { resetReaction(); return; }
    if (analyser && !motion.matches && !document.hidden) {
      analyser.getByteFrequencyData(frequencyData);
      const binHz = audioContext.sampleRate / analyser.fftSize;
      const low = Math.max(1, Math.floor(45 / binHz));
      const high = Math.min(frequencyData.length-1, Math.ceil(180 / binHz));
      let energy = 0;
      for (let i=low;i<=high;i++) energy += frequencyData[i];
      const target = Math.pow(energy / ((high-low+1)*255), 2);
      bassLevel += (target-bassLevel) * (target > bassLevel ? .75 : .23);
      reactiveLogo.style.setProperty('--audio-scale', String(1 + bassLevel * .0175));
      reactiveLogo.style.setProperty('--audio-glow', `${4 + bassLevel * 18}px`);
    }
    reactionFrame = requestAnimationFrame(reactToAudio);
  }
  audio.addEventListener('playing',()=>{cancelAnimationFrame(reactionFrame);reactToAudio();});
  ['pause','ended','error','emptied','waiting'].forEach(event=>audio.addEventListener(event,resetReaction));
  motion.addEventListener('change',()=>{if(motion.matches)resetReaction();else if(!audio.paused)reactToAudio();});
</script>
